name: Build Lost City Navigator (Paper 1.21.8)
on:
  workflow_dispatch:
  push:
    paths:
      - 'pom.xml'
      - 'src/**'
      - '.github/workflows/build-paper.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile against real Paper API
        run: mvn -B --no-transfer-progress clean package
      - uses: actions/upload-artifact@v4
        with:
          name: LostCityNavigator-0.9.2-Paper-1.21.8
          path: target/LostCityNavigator-0.9.2.jar
