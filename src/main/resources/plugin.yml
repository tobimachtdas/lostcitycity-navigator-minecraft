name: LostCityNavigator
version: 0.9.2
main: de.lostcity.LostCityNavigator
api-version: '1.21'
author: tobimachtdas
website: https://www.youtube.com/@tobimachtdas
description: Navigator for private and administrator-approved Lost City Finder discoveries.
commands:
  lostcity:
    description: Get a navigator compass or list/reload locations
    usage: /lostcity [compass|list|reload]
permissions:
  lostcity.use:
    description: Use the navigator
    default: true
  lostcity.admin:
    description: View and reload private locations
    default: op
