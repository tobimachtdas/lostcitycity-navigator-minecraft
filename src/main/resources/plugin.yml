name: LostCityNavigator
version: 1.0.0-beta1
main: de.lostcity.LostCityNavigator
api-version: '1.21'
author: tobimachtdas
website: https://www.youtube.com/@tobimachtdas
description: Lost City Finder compass, right sidebar and permission-gated teleport.
commands:
  lostcity:
    description: Navigator, target sidebar, teleport and in-game scanner
    usage: /lostcity [compass|list|map|next|prev|tp|reload|scan]
permissions:
  lostcity.use:
    description: Use the navigator and sidebar
    default: true
  lostcity.admin:
    description: View private destinations and reload locations
    default: op
  lostcity.teleport:
    description: Teleport to an approved selected destination
    default: op

  lostcity.scan:
    description: Start, monitor or stop the admin-only in-game search
    default: op
